name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full unittest suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Shell script syntax check
        run: |
          for f in infra/install.sh scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Basic secret scan (fails the build if something looks like a committed secret)
        run: python3 scripts/check_secrets.py
